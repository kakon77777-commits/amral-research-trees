project:
  id: au2e2-first-crossing-reset
  title: Is the First-Crossing Reset Inequality a second fact, or the Correction Bound restated?
  language: en

# Round A-U.2e.2 states two inequalities in sequence, as if the second followed
# from the first with something left over:
#
#     First-Crossing Correction Bound     B_L <= L * 3^(L-1)
#     First-Crossing Reset Inequality     Y_{a+L} <= 2^-D (Y_a + L/3)
#
# Substituting the closed form Y_{a+L} * 2^Q_L = 3^L Y_a + B_L and clearing
# denominators turns the second into
#
#     3 * (3^L Y_a + B_L)  <=  3^L * (3 Y_a + L)
#
# whose Y_a terms cancel identically, leaving 3 B_L <= L 3^L -- which is the
# first inequality. So the second is not a further fact about the orbit; it is
# the correction bound rewritten, and it holds for EVERY Y_a whatsoever.
#
# That is worth handing to a solver rather than asserting, because "the Y_a terms
# cancel" is exactly the kind of step that is easy to believe and easy to get
# wrong. FELRA v1.8.0 renders each claim as an SMT-LIB2 obligation asserting the
# declared domain and the NEGATION of the claim, so `unsat` means no counterexample
# exists over that domain -- and checks each against a twin with the conclusion
# flipped, so an obligation that is unsatisfiable for the wrong reason cannot be
# reported as a proof.
#
# L is fixed at 5 so that 3^L and 2^Q_L are literal integers. That is a real
# restriction and it is the point of the fourth analysis below: with L symbolic
# the claim has a variable exponent, which cannot be rendered in SMT-LIB2 without
# changing its meaning, and FELRA refuses rather than approximating. The round's
# central inequality is therefore NOT solver-checkable in general -- only slice by
# slice. That refusal is recorded here rather than worked around.
#
# Slice: L = 5, Q_L = 8 (the crossing at the convergent 8/5).
#   3^5 = 243,  2^8 = 256,  L*3^(L-1) = 405,  2^Q - 3^L = 13.
#
# Requires Z3_EXE. Without it every analysis here reports `unavailable`.

parameters:
  y:
    type: int
    range: [1, 1000000]
    samples: 25
  b:
    type: int
    range: [0, 1000000]
    samples: 25

claims:
  - id: reset_follows_from_the_correction_bound
    statement: >
      At L=5, the correction bound b <= 405 implies the reset inequality, for
      every start y in the declared range.
    expression: not (b <= 405) or 3 * (243 * y + b) <= 243 * (3 * y + 5)
    status: hypothesis
    required_checks:
      - numerical

  - id: reset_needs_the_correction_bound
    statement: >
      The reset inequality does NOT hold on its own. FALSE on this domain, and a
      solver should hand back a counterexample rather than a proof.
    expression: 3 * (243 * y + b) <= 243 * (3 * y + 5)
    status: hypothesis
    required_checks:
      - numerical

  - id: reset_is_equivalent_to_the_correction_bound
    statement: >
      The two are the same statement: each implies the other, so the reset
      inequality carries no information about y at all.
    expression: >
      (not (b <= 405) or 3 * (243 * y + b) <= 243 * (3 * y + 5)) and
      (not (3 * (243 * y + b) <= 243 * (3 * y + 5)) or b <= 405)
    status: hypothesis
    required_checks:
      - numerical

  - id: the_general_form_has_a_symbolic_exponent
    statement: >
      With L symbolic the same claim needs 3^L and 2^Q, which SMT-LIB2 cannot
      render exactly. Declared so that the refusal is on the record.
    expression: 3 ** y <= 2 ** b
    status: hypothesis
    required_checks:
      - numerical

analyses:
  - id: prove_reset_from_bound
    type: obligation_export
    title: Export the implication and let z3 settle it over the whole declared box
    claim_id: reset_follows_from_the_correction_bound
    backend: z3
    path: ${Z3_EXE}
    expect: verified

  - id: refute_reset_alone
    type: obligation_export
    title: Export the unguarded inequality — a counterexample is the correct outcome
    claim_id: reset_needs_the_correction_bound
    backend: z3
    path: ${Z3_EXE}
    expect: refuted

  - id: prove_equivalence
    type: obligation_export
    title: The reset inequality IS the correction bound, in both directions
    claim_id: reset_is_equivalent_to_the_correction_bound
    backend: z3
    path: ${Z3_EXE}
    expect: verified

  - id: refusal_on_symbolic_exponent
    type: obligation_export
    title: What FELRA will not export, and why the general round is not solver-checkable
    claim_id: the_general_form_has_a_symbolic_exponent
    backend: z3
    path: ${Z3_EXE}
    expect: verified
